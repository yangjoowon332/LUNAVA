<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunava</title>


    <!-- 공통디자인스타일 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/hero_sub.css">
    <!-- 로그인디자인 -->
    <link rel="stylesheet" href="css/login.css">
    <!-- 리셋 -->
    <link rel="stylesheet" href="css/reset.css">
    <!-- 폰트 -->
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">


</head>

<body>
    <div class="wrap">
        <header>
            <!-- 헤더자리 -->
        </header>
        <div id="hero_sub">
            <div class="centerbox">
                <img src="img/login_img/mumyeonheo_Extend_the_background_of_the_image_naturally_keepi_f97833c5-9300-4b8b-96cf-88d64b638f5c_3.WEBP"
                    alt="">
                <div class="textbox">
                    <h1>LOGIN</h1>
                    <strong>당신만의 향과 빛을<br>
                        만나러 오신 걸 환영합니다.
                    </strong>
                    <p>Lunava, 하루의 쉼표를<br> 여는 문이 열립니다.
                    </p>
                </div>
            </div>
            <span class="pc_nav_bg"></span>
        </div>

        <div class="section_box_sub2 login">
            <div id="section">
                <div class="centerbox">
                    <div class="login_header">

                        <span>WELCOME BACK</span>

                        <h2>Sign In to LUNAVA</h2>

                        <p>
                            LUNAVA의 컬렉션과 멤버 서비스를
                            계속 만나보세요.
                        </p>

                    </div>

                    <div class="content">

                        <form method="post" action="">
                            <fieldset>
                                <legend>로그인</legend>
                                <div class="input_box">
                                    <div class="id_box">
                                        <p>아이디</p>
                                        <input type="text" placeholder="아이디를입력하시오" name="id" required>
                                    </div>
                                    <div class="pw_box">
                                        <p>비밀번호</p>
                                        <input type="password" id="password2" placeholder="패스워드를입력하시오" name="pw"
                                            required>

                                        <i class="fa-solid fa-eye-slash"></i>

                                        <i class="fa-solid fa-eye"></i>

                                    </div>
                                </div>

                                <div class="link_box">
                                    <div class="id_save">
                                        <input type="checkbox" id="saveid">
                                        <label for="saveid">
                                            <span class="checkbox"><i class="fa-solid fa-check"
                                                    style="color: #ffffff;"></i></i></span>아이디 저장</label>
                                    </div>
                                    <div class="link">
                                        <a href="#">아이디 찾기</a>
                                        <a href="#">비밀번호 찾기</a>
                                        <a href="join.html">회원가입</a>
                                    </div>
                                </div>
                                <button class="btn btn_login">로그인 하기</button>
                            </fieldset>
                        </form>

                    </div>

                </div>
                </id.section>
            </div>
        </div>

        <footer>
            <!-- 푸터자리 -->
        </footer>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="script/action.js"></script>

        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script>
            AOS.init();
        </script>

</body>


</html>
